<!DOCTYPE html>
<html>
<head>
    <title>Five Nights At Freddy's 4 | Fungi</title>
    <link id="favicon" rel="icon" type="image/png" href="https://codehs.com/uploads/dbf77e4f4711feb9506d37e52b30a2dd">

    <script> 
        if (typeof setTheme !== 'function') {
            window.setTheme = function(t) { console.log("Theme set to:", t); };
        }
        setTheme('ocean'); 
    </script>
    <script src="theme.js"></script>
    
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }

        /* Spores Layer */
        canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1 !important;
            background-color: var(--bg-color);
        }

        /* Transparent Loader Container */
        #loader-container {
            background-color: transparent; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 999999;
            pointer-events: none;
        }

        /* Game Container */
        #game-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="spores-canvas"></canvas>

    <div id="loader-container">
        <div class="loader">
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
        </div>

        <div class="loading-text" style="text-align: center; margin-top: 20px; color: var(--accent-color);">
            Loading... <br>
            Turn ur volume up, you're gonna need it<br>
            Loading Animation from 
            <a href="https://uiverse.io/andrew-manzyk/unlucky-mouse-21" target="_blank" style="pointer-events: auto;">UIverse</a>
        </div>
    </div>

    <div id="game-content"></div>

    <script>
        const url = "https://raw.githubusercontent.com/gibberish2/Fungifiles/main/fnaf4.html";

        async function loadTemplate() {
            try {
                let response = await fetch(url);
                if (response.ok) {
                    let html = await response.text();
                    
                    const gameContent = document.getElementById('game-content');
                    const iframe = document.createElement('iframe');
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                    iframe.style.border = "none";
                    gameContent.appendChild(iframe);

                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(html);
                    doc.close();

                    const style = document.createElement('style');
                    style.textContent = `
                        .back-launcher-btn {
                            position: fixed;
                            bottom: 8px;
                            left: 10px;
                            z-index: 100000;
                            padding: 8px 25px;
                            background-color: rgba(0, 0, 25, 0.5);
                            color: white;
                            border: 2px solid white;
                            border-radius: 50px;
                            font-family: 'Comic Sans MS', cursive;
                            font-weight: bold;
                            cursor: pointer;
                            backdrop-filter: blur(4px);
                            transition: transform 0.2s;
                        }
                        .back-launcher-btn:hover { transform: scale(1.1); }
                    `;
                    document.head.appendChild(style);

                    const backButton = document.createElement('button');
                    backButton.className = 'back-launcher-btn';
                    backButton.innerHTML = '← Return to Launcher';
                    backButton.onclick = () => { window.location.href = 'launcher.html'; };
                    document.body.appendChild(backButton);

                    // Show game and cleanup loading assets
                    gameContent.style.display = "block";
                    
                    const spores = document.getElementById("spores-canvas");
                    if (spores) spores.remove();

                    const loader = document.getElementById("loader-container");
                    if (loader) loader.remove();

                } else {
                    throw new Error("CDN response not OK");
                }
            } catch (e) {
                console.error("Load failed:", e);
                document.body.innerHTML = "<h1 style='color:white; text-align:center; padding-top:50px; font-family: cursive;'>Failed to load game.</h1>";
            }
        }

        loadTemplate();
    </script>
    <script src="spores.js"></script>
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2fb5e9188fd9485ca71dcc4ab49bf350"}'></script>
</body>
</html>
