<style>
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            transition: background-color 0.3s ease;
        }
        
        :root {
            interpolate-size: allow-keywords;
        }
        
        .content {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .oi-title {
            font-family: 'Oi', serif;
            font-weight: 1;
            font-style: normal;
        }
        
        .theme-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: fit-content;
            min-width: 150px;
            max-width: 90vw;
            margin: 10px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            color: var(--on-accent, #1F140D);
            background-color: var(--accent-color);
            white-space: nowrap;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .theme-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 0 15px var(--accent-color);
        }
        
        #btnText {
            display: inline-block;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
        }
        
        .text-hidden {
            opacity: 0;
            transform: translateY(5px);
        }
        
        /* blur background when popup is open */
        body.popup-open > .content,
        body.popup-open > nav {
            filter: blur(6px);
        }
        
        /* overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
            z-index: 50;
        }
        
        /* popup */
        .updateDiv {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            width: fit-content;
            max-width: 90vw;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            z-index: 1000;
            filter: none !important;
        }
        
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .updateDiv.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        /* generic button */
        button {
            margin-top: 15px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: var(--accent-color);
            color: var(--on-accent, #1F140D);
            cursor: pointer;
        }
        
        #rndmText {
            color: var(--text-color);
            display: block;
            margin-top: 10px;
        }

    </style>

function changeText() {
    const rndmText = document.getElementById('rndmText');
    const rndmImg = document.getElementById('rndmImage'); // Ensure you have <img id="rndmImage"> in HTML
    
    rndmText.classList.add('text-hidden');

    setTimeout(() => {
        // Pick a random object from the list
        let choice = content[Math.floor(Math.random() * content.length)];
        let displayText = choice.text;
        
        // Handle Battery Placeholder
        if (displayText.includes("BATTERY_PLACEHOLDER")) {
            displayText = "Your battery's totally not at " + batteryPlaceholder + "% percent.🤭";
        }
        
        // Update Text
        rndmText.innerText = displayText;

        // Optional Image Logic
        if (choice.url) {
            rndmImg.src = choice.url;
            rndmImg.style.display = "block"; // Show image if URL exists
        } else {
            rndmImg.style.display = "none";  // Hide image if URL is null/empty
        }

        void rndmText.offsetWidth; 
        rndmText.classList.remove('text-hidden');
    }, 200);
}

<script>
const overlay = document.getElementById("overlay");
const updateBox = document.getElementById("updateBox");
const closeBtn = document.getElementById("closeBtn");

function openPopup() {
    document.body.classList.add("popup-open");
    overlay.classList.add("active");
    updateBox.classList.add("active");
}

function closePopup() {
    overlay.classList.remove("active");
    updateBox.classList.remove("active");
    document.body.classList.remove("popup-open");
}

overlay.addEventListener("click", closePopup);
closeBtn.addEventListener("click", closePopup);


openPopup();
</script>
