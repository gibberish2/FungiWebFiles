<!DOCTYPE html>
<html>
<head>
<title>Doodle Jump | Fungi</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/gibberish2/FungiWebFiles@main/assets/logo.svg">

<body>
    <script>
        const url = "https://raw.githubusercontent.com/gibberish2/Fungifiles/main/doodlejump.html";

        async function loadTemplate() {
            try {
                let response = await fetch(url);
                if (response.ok) {
                    let html = await response.text();
                    
                    document.open();
                    document.write(html);
                    document.close();

                    const style = document.createElement('style');
                    style.textContent = `
                        .back-launcher-btn {
                            position: fixed;
                            bottom: 8px;
                            left: 10px;
                            z-index: 100000;
                            padding: 8px 25px;
                            background-color: rgba(0, 0, 25, 0.5);
                            color: white;
                            border: 2px solid white;
                            border-radius: 50px;
                            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
                            font-weight: bold;
                            cursor: pointer;
                            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
                            backdrop-filter: blur(4px);
                            transition: transform 0.2s;
                        }
                        .back-launcher-btn:hover {
                            transform: scale(1.1);
                            background-color: rgba(0, 0, 50, 0.3);
                        }
                    `;
                    document.head.appendChild(style);

                    const backButton = document.createElement('button');
                    backButton.className = 'back-launcher-btn';
                    backButton.innerHTML = '← Return to Launcher';
                    
                    backButton.onclick = function() {
                        window.location.href = 'launcher.html';
                    };
                    document.body.appendChild(backButton);

                } else {
                    throw new Error("CDN response not OK");
                }
            } catch (e) {
                console.error("Load failed:", e);
                document.body.innerHTML = "<h1>Failed to load game.</h1>";
            }
        }

        loadTemplate();
    </script>
</body>
</html>
