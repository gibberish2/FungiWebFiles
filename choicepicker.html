.search-label {
  display: flex;
  align-items: center;
  box-sizing: border-box;
  position: relative;
  border: 1px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  background: #3D3D3D;
  padding: 9px;
  cursor: text;
}

.search-label:hover {
  border-color: gray;
}

.search-label:focus-within {
  background: #464646;
  border-color: gray;
}

.search-label input {
  outline: none;
  width: 100%;
  border: none;
  background: none;
  color: rgb(162, 162, 162);
}

.search-label input:focus+.slash-icon,
.search-label input:valid+.slash-icon {
  display: none;
}

.search-label input:valid~.search-icon {
  display: block;
}

.search-label input:valid {
  width: calc(100% - 22px);
  transform: translateX(20px);
}

.search-label svg,
.slash-icon {
  position: absolute;
  color: #7e7e7e;
}

.search-icon {
  display: none;
  width: 12px;
  height: auto;
}

.slash-icon {
  right: 7px;
  border: 1px solid #393838;
  background: linear-gradient(-225deg, #343434, #6d6d6d);
  border-radius: 3px;
  text-align: center;
  box-shadow: inset 0 -2px 0 0 #3f3f3f, inset 0 0 1px 1px rgb(94, 93, 93), 0 1px 2px 1px rgba(28, 28, 29, 0.4);
  cursor: pointer;
  font-size: 12px;
  width: 15px;
}

.slash-icon:active {
  box-shadow: inset 0 1px 0 0 #3f3f3f, inset 0 0 1px 1px rgb(94, 93, 93), 0 1px 2px 0 rgba(28, 28, 29, 0.4);
  text-shadow: 0 1px 0 #7e7e7e;
  color: transparent;
}

    <input type="submit" class="jello-horizontal" id="submit" >Ask!</input>

  <span id="result" >You'll see the result here</span>





<script>
    const choice1 = document.getElementById('choice1');
    const choice2 = document.getElementById('choice2');
    const submit = document.getElementById('submit');
    const resultElement = document.getElementById('result');

    function decide() {
        const choice1val = choice1.value.trim();
        const choice2val = choice2.value.trim();

        if (!choice1val || !choice2val) {
            resultElement.textContent = 'Please enter both choices!';
            return;
        }

        const randomChoice = Math.floor(Math.random() * 2) + 1;

        if (randomChoice === 1) {
            resultElement.textContent = choice1val;
        } else {
            resultElement.textContent = choice2val;
        }
    }

    submit.addEventListener('click', decide);
</script>
