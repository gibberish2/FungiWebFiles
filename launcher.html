     *{

        body { font-family: 'Comic Sans MS', cursive !important; }
        #gameSearch {
            margin: 30px 0;
            padding: 15px;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-family: inherit;
            background: var(--nav-color);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .button-grid {
            margin-top: 75px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 2000px;
            margin-bottom: 50px;
        }

        .game-btn {
            aspect-ratio: 1 / 1;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            border-radius:15px;
            flex-direction: column; /* Stacks image on top, banner on bottom */
            overflow: hidden;
            padding: 0;
            background: none; /* We move the image to a child div */
        }

        .game-btn:hover { transform: scale(1.05); }

        /* The Logo Area */
        .game-img {
            flex-grow: 1; /* Takes up all available space above the banner */
            width: 100%;
            background-size: cover;
            background-position: center;
        }

        /* The Title Banner */
        .game-banner {
            width: 100%;
            background-color: var(--nav-color); /* Uses your background color variable */
            color: white;
            padding: 10px 0;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1); /* Optional: slight separation line */
            border-radius: 5px;
            /* ADD THIS LINE BELOW: It makes the movement smooth */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* 2. ADD THIS NEW BLOCK: It moves the banner when you hover the button */
        .game-banner:hover {
            transform: translateY(-8px); /* Moves it up */
            background-color: var(--nav-color); /* Changes color slightly */
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3); /* Adds a shadow for depth */
        }
